name: appimage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release aus der Version in src/vtf/__init__.py veröffentlichen (nur auf main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # ältere glibc -> das AppImage läuft auch auf älteren Distributionen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 squashfs-tools
      - name: Qt Multimedia prüfen
        # PyInstaller lässt Qt-Module weg, die sich hier nicht importieren lassen
        run: |
          python -m pip install --quiet PySide6-Essentials
          QT="$(python -c 'import PySide6, os; print(os.path.dirname(PySide6.__file__))')"
          ldd "$QT"/QtMultimedia.abi3.so "$QT"/Qt/lib/libQt6Multimedia.so.6 | grep "not found" || true
          python -c "import PySide6.QtMultimedia; print('QtMultimedia ok')"
      - name: AppImage bauen
        run: PYTHON=python ./scripts/build-appimage.sh
      - name: Selbsttest des AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from videogen import make_video; make_video(Path('selftest.avi'))"
          ./dist/*.AppImage --selftest selftest.avi selftest.png
      - uses: actions/upload-artifact@v4
        with:
          name: Video-to-Funscript-AppImage
          path: |
            dist/*.AppImage
            selftest.png
      - name: Release-Dateien vorbereiten
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "src"); import vtf; print(vtf.__version__)')"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ $VERSION"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG gibt es schon. Version in src/vtf/__init__.py und pyproject.toml erhöhen."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir release
          # fester Name: stabiler Download-Link und Ziel des Updaters
          cp dist/*.AppImage release/Video-to-Funscript-x86_64.AppImage
          (cd release && sha256sum Video-to-Funscript-x86_64.AppImage > SHA256SUMS && cat SHA256SUMS)
      - name: Release veröffentlichen
        if: steps.rel.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        # erst als Entwurf mit allen Dateien, dann veröffentlichen:
        # bei unveränderlichen Releases lassen sich danach keine Dateien mehr anhängen.
        # Bei manuellem Start legt gh den Tag auf dem gebauten Commit an.
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Video-to-Funscript $TAG" --notes-file packaging/release-notes.md \
            release/Video-to-Funscript-x86_64.AppImage release/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
