name: appimage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ältere glibc -> das AppImage läuft auch auf älteren Distributionen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 squashfs-tools
      - name: AppImage bauen
        run: PYTHON=python ./scripts/build-appimage.sh
      - name: Selbsttest des AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from videogen import make_video; make_video(Path('selftest.avi'))"
          ./dist/*.AppImage --selftest selftest.avi selftest.png
      - uses: actions/upload-artifact@v4
        with:
          name: Video-to-Funscript-AppImage
          path: |
            dist/*.AppImage
            selftest.png
      - name: Release-Dateien vorbereiten
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "src"); import vtf; print(vtf.__version__)')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ $VERSION"; exit 1
          fi
          mkdir release
          # fester Name: stabiler Download-Link und Ziel des Updaters
          cp dist/*.AppImage release/Video-to-Funscript-x86_64.AppImage
          (cd release && sha256sum Video-to-Funscript-x86_64.AppImage > SHA256SUMS && cat SHA256SUMS)
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # erst als Entwurf mit allen Dateien, dann veröffentlichen:
        # bei unveränderlichen Releases lassen sich danach keine Dateien mehr anhängen
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Video-to-Funscript $GITHUB_REF_NAME" --notes-file packaging/release-notes.md \
            release/Video-to-Funscript-x86_64.AppImage release/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
