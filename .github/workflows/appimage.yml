name: appimage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ältere glibc -> das AppImage läuft auch auf älteren Distributionen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 squashfs-tools
      - name: AppImage bauen
        run: PYTHON=python ./scripts/build-appimage.sh
      - name: Selbsttest des AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from conftest import make_video; make_video(Path('selftest.avi'))"
          ./dist/*.AppImage --selftest selftest.avi selftest.png
      - uses: actions/upload-artifact@v4
        with:
          name: Video-to-Funscript-AppImage
          path: |
            dist/*.AppImage
            selftest.png
      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
