name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15        # a hanging test must not block the PR for hours
    strategy:
      fail-fast: false
      matrix:
        # "system" = Python 3.10 von Ubuntu 22.04 (ältestes unterstütztes Python),
        # ohne Download von GitHub-Releases
        python: ["system", "3.13"]
    name: test (${{ matrix.python == 'system' && '3.10' || matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: System-Pakete
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: python3 --version && python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"
      - run: python3 -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
