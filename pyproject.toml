[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-funscript"
version = "0.10.13"
description = "Lokale, kostenlose Videoanalyse und Funscript-Erstellung"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # headless: avoids Qt plugin clashes with PySide6
    "opencv-python-headless>=4.8",
    # Essentials = QtCore/Gui/Widgets/Svg, ohne WebEngine & Co. (deutlich kleiner)
    "PySide6-Essentials>=6.5",
    # Addons enthält QtMultimedia (Ton bei der Wiedergabe); das AppImage packt
    # davon nur dieses Modul ein
    "PySide6-Addons>=6.5",
    # Zertifikate für den Updater, falls das System keine an bekannter Stelle hat
    "certifi>=2024.0",
    # Intiface Central (Buttplug) spricht WebSocket
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.scripts]
vtf = "vtf.cli:main"

[project.gui-scripts]
vtf-gui = "vtf.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vtf.gui" = ["resources/*.svg", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
